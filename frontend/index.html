<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perim — Field Memory Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="board">

  <header class="masthead">
    <div class="masthead-left">
      <h1>Perim<span class="tm">&reg;</span></h1>
      <p class="subhead">Field memory ledger — remembers on the device, reports to base when it can</p>
    </div>
    <div class="masthead-right">
      <div class="device-id">
        <label for="deviceName">FIELD UNIT</label>
        <input id="deviceName" type="text" maxlength="18" value="">
      </div>
      <button class="stamp" id="linkStamp" title="Tap to simulate cutting the link">
        <span class="stamp-ring"></span>
        <span class="stamp-text" id="linkStampText">OFFLINE</span>
      </button>
    </div>
  </header>

  <div class="linkbar" id="linkBar">checking connection…</div>

  <nav class="folders">
    <button class="folder active" data-v="memory"><span>01</span>Memory<i class="folder-count" id="cMemory"></i></button>
    <button class="folder" data-v="search"><span>02</span>Search</button>
    <button class="folder" data-v="live"><span>03</span>Live feed<i class="folder-count" id="cLive">off</i></button>
    <button class="folder" data-v="sync"><span>04</span>Sync queue<i class="folder-count" id="cQueue"></i></button>
    <button class="folder" data-v="cloud"><span>05</span>Base station<i class="folder-count" id="cCloud"></i></button>
    <button class="folder" data-v="log"><span>06</span>Log book</button>
  </nav>

  <main id="view" class="sheet"></main>

  <footer class="ledger-footer">
    <div class="ledger-cell"><small>ON THIS UNIT</small><b id="mLocal">0</b></div>
    <div class="ledger-cell"><small>FILED AT BASE</small><b id="mSynced">0</b></div>
    <div class="ledger-cell"><small>LAST DISPATCH</small><b id="mLastSync">—</b></div>
    <div class="ledger-cell"><small>BASE MODE</small><b id="mCloudMode">—</b></div>
  </footer>

</div>

<script src="/assets/app.js"></script>
</body>
</html>
